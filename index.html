<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101813">
  <meta name="description" content="A quiet local-time clock surrounded by nature.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com; connect-src 'none';">
  <title>Stillpoint | Local time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --ink: #f5f7f0;
      --muted: rgba(235, 241, 229, 0.68);
      --line: rgba(255, 255, 255, 0.18);
      --glass: rgba(16, 25, 20, 0.34);
      --glass-strong: rgba(17, 26, 21, 0.56);
      --accent: #d3efb1;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      color: var(--ink);
      background: #101813;
      font-family: "Manrope", sans-serif;
    }

    .scene,
    .scene::before,
    .scene::after {
      position: fixed;
      inset: 0;
    }

    .scene {
      display: grid;
      place-items: center;
      isolation: isolate;
      background-position: center;
      background-size: cover;
      transition: background-image 1.2s ease-in-out;
    }

    .scene::before {
      z-index: -2;
      content: "";
      background:
        linear-gradient(120deg, rgba(6, 14, 11, 0.72), rgba(11, 20, 15, 0.18) 52%, rgba(3, 10, 8, 0.57)),
        radial-gradient(circle at 50% 45%, transparent 0, rgba(4, 10, 7, 0.36) 78%);
    }

    .scene::after {
      z-index: -1;
      content: "";
      pointer-events: none;
      opacity: 0.25;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .topbar {
      position: absolute;
      top: clamp(24px, 5vw, 52px);
      left: clamp(24px, 6vw, 84px);
      right: clamp(24px, 6vw, 84px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .brand { color: var(--ink); }

    .brand::before {
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 16px rgba(211, 239, 177, 0.8);
      content: "";
    }

    .clock-card {
      --drag-x: 0px;
      --drag-y: 0px;
      --stretch-x: 1;
      --stretch-y: 1;
      --shear-x: 0deg;
      --shear-y: 0deg;
      --tilt-x: 0deg;
      --tilt-y: 0deg;
      --pointer-x: 50%;
      --pointer-y: 50%;
      position: relative;
      width: min(680px, calc(100vw - 40px));
      overflow: hidden;
      padding: clamp(34px, 7vw, 72px) clamp(24px, 7vw, 78px) clamp(30px, 5vw, 52px);
      border: 1px solid var(--line);
      border-radius: 24px;
      background: linear-gradient(145deg, rgba(255,255,255,0.12), rgba(255,255,255,0.025) 46%), var(--glass);
      box-shadow: 0 28px 80px rgba(0, 0, 0, 0.32), inset 0 1px 0 rgba(255, 255, 255, 0.13);
      backdrop-filter: blur(18px) saturate(115%);
      -webkit-backdrop-filter: blur(18px) saturate(115%);
      text-align: center;
      transform: perspective(900px) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)) skewX(var(--shear-x)) skewY(var(--shear-y)) scale(var(--stretch-x), var(--stretch-y));
      transform-origin: center;
      touch-action: none;
      user-select: none;
      animation: rise-in 900ms cubic-bezier(.2,.8,.2,1) both;
      will-change: transform;
    }

    .clock-card::after {
      position: absolute;
      inset: -35%;
      z-index: 0;
      content: "";
      pointer-events: none;
      background: radial-gradient(circle at var(--pointer-x) var(--pointer-y), rgba(211, 239, 177, 0.2), transparent 28%);
      opacity: 0;
      transform: scale(0.7);
      transition: opacity 240ms ease, transform 500ms cubic-bezier(.2,.8,.2,1);
    }

    .clock-card > * {
      position: relative;
      z-index: 1;
    }

    .clock-card.is-dragging::after {
      opacity: 1;
      transform: scale(1);
    }

    .eyebrow {
      margin: 0 0 22px;
      color: var(--accent);
      font-family: "DM Mono", monospace;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .time {
      margin: 0;
      font-family: "DM Mono", monospace;
      font-size: clamp(3.2rem, 11vw, 7.3rem);
      font-weight: 400;
      letter-spacing: -0.07em;
      line-height: 0.95;
      text-shadow: 0 4px 30px rgba(0, 0, 0, 0.2);
      white-space: nowrap;
    }

    .date {
      margin: 25px 0 0;
      color: var(--muted);
      font-size: clamp(0.82rem, 2vw, 0.96rem);
      letter-spacing: 0.06em;
    }

    .footer {
      position: absolute;
      bottom: clamp(24px, 5vw, 52px);
      left: clamp(24px, 6vw, 84px);
      right: clamp(24px, 6vw, 84px);
      display: flex;
      justify-content: space-between;
      color: rgba(235, 241, 229, 0.55);
      font-size: 0.68rem;
      letter-spacing: 0.08em;
    }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 520px) {
      .topbar, .footer { font-size: 0.58rem; }
      .topbar span:last-child { display: none; }
      .footer { letter-spacing: 0.04em; }
      .footer span:last-child { display: none; }
      .clock-card { border-radius: 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .clock-card { animation: none; transform: none; }
      .clock-card::after { display: none; }
      .scene { transition: none; }
    }
  </style>
</head>
<body>
  <main class="scene" id="scene">
    <header class="topbar" aria-label="Site header">
      <span class="brand">Stillpoint</span>
      <span>Quiet moments, wherever you are</span>
    </header>

    <section class="clock-card" aria-label="Current local time">
      <p class="eyebrow">Your local time</p>
      <time class="time" id="time" aria-live="off">00:00:00</time>
      <p class="date" id="date">Loading date...</p>
    </section>

    <footer class="footer">
      <span id="timezone">Local timezone</span>
      <span>Take a breath</span>
    </footer>
  </main>

  <script src="app.js" defer></script>
</body>
</html>
